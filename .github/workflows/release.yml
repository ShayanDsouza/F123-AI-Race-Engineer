name: release builds

# Tag a commit `v1.2.0` and this builds a no-Python-needed bundle for
# Windows, macOS and Linux, and attaches the zips to a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
          - os: macos-latest
            label: macos
          - os: ubuntu-latest
            label: linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: pyinstaller packaging/sim-vs-reality.spec --noconfirm
      - name: smoke test the bundle
        shell: bash
        run: |
          ./dist/sim-vs-reality/sim-vs-reality --help
      - name: zip
        shell: bash
        run: |
          cd dist
          if [ "${{ matrix.label }}" = "windows" ]; then
            7z a ../sim-vs-reality-${{ matrix.label }}.zip sim-vs-reality
          else
            zip -qr ../sim-vs-reality-${{ matrix.label }}.zip sim-vs-reality
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: sim-vs-reality-${{ matrix.label }}
          path: sim-vs-reality-${{ matrix.label }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: bundles
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: bundles/*.zip
          generate_release_notes: true
